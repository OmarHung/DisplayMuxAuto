name: Signed desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: displaymux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ""
          - label: macOS Universal
            runner: macos-latest
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            args: "--target universal-apple-darwin"

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "const fs=require('fs');const app=require('./src-tauri/tauri.conf.json').version;const pkg=require('./package.json').version;const cargo=fs.readFileSync('./src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1];if(process.env.GITHUB_REF_NAME!=='v'+app||pkg!==app||cargo!==app){throw new Error('Tag, Tauri, package.json and Cargo.toml versions must match')}"

      - name: Test frontend
        run: pnpm build

      - name: Test Rust workspace
        run: cargo test --locked --all-targets

      - name: Classify release channel
        id: channel
        shell: bash
        run: node -p '"prerelease=" + require("./src-tauri/tauri.conf.json").version.includes("-")' >> "$GITHUB_OUTPUT"

      - name: Build signed draft release
        uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Where diagnostic reports go. A DSN only allows submitting events, so
          # it is a repository variable rather than a secret; without it the
          # build still works and offers saving reports to a file instead.
          MUXSU_SENTRY_DSN: ${{ vars.MUXSU_SENTRY_DSN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: MuxSU v__VERSION__
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "MuxSU-[version]-[platform]-[arch][setup][ext]"
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  publish-release:
    name: Publish complete release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read application version
        id: app_version
        shell: bash
        run: node -p '"version=" + require("./src-tauri/tauri.conf.json").version' >> "$GITHUB_OUTPUT"

      - name: Classify release channel
        id: channel
        shell: bash
        run: node -p '"prerelease=" + require("./src-tauri/tauri.conf.json").version.includes("-")' >> "$GITHUB_OUTPUT"

      - name: Compose bilingual release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.app_version.outputs.version }}"
          gh release view "$tag" --json assets --jq .assets > release-assets.json
          node scripts/compose-release-notes.mjs \
            --tag "$tag" \
            --repository "${{ github.repository }}" \
            --assets release-assets.json \
            --output release-notes.md

      - name: Add release notes to updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.app_version.outputs.version }}"
          mkdir -p updater-manifest
          gh release download "$tag" --pattern latest.json --dir updater-manifest
          node scripts/set-updater-notes.mjs \
            --manifest updater-manifest/latest.json \
            --notes release-notes.md
          gh release upload "$tag" updater-manifest/latest.json --clobber

      - name: Publish signed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.app_version.outputs.version }}"
          if [ "${{ steps.channel.outputs.prerelease }}" = "true" ]; then
            # A pre-release must never become the updater's latest.json source, so
            # existing installations keep resolving to the newest stable release.
            gh release edit "$tag" --notes-file release-notes.md --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --notes-file release-notes.md --draft=false --prerelease=false --latest
          fi
