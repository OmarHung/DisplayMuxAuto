[package]
name = "displaymux-app"
version = "0.1.8"
description = "Switch one shared monitor safely between Windows and macOS"
authors = ["DisplayMux contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "displaymux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Keep Windows GUI builds console-free by default. Developers can opt in with
# `pnpm tauri dev --features console` when terminal logs are needed.
console = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
displaymux-core = { path = "../crates/displaymux-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
